[pytest]
# 最低 pytest 版本（--strict-config 需要 7.0+）
minversion = 7.0

# 不带参数运行 `pytest` 时，自动扫描 tests/
testpaths = tests

# 失败时打印摘要；严格校验 marker 与 ini 选项，避免拼写错误
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

# 若将来加自定义 marker，在这里注册（示例，按需解注）
# markers =
#     slow: 标记慢测试
#     integration: 集成测试（依赖真实 cnlunar / PyQt6）

# 若想把某些 warning 升级为错误（谨慎开启，先观察）：
# filterwarnings =
#     error
#     # 暂时豁免第三方库的 DeprecationWarning
#     default::DeprecationWarning:PyQt6.*
#     default::DeprecationWarning:cnlunar.*