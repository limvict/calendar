[pytest]
testpaths = tests
pythonpath = .

norecursedirs =
    .git
    .hg
    .svn
    .tox
    .nox
    .eggs
    *.egg
    build
    dist
    node_modules
    venv
    .venv
    env
    .env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .idea
    .vscode
    System Volume Information
    $RECYCLE.BIN
    Recovery

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    slow: mark slow tests
    integration: integration tests (real cnlunar / network)