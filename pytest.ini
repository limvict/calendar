[pytest]
# 显式限定收集范围，避免从盘根递归扫描
testpaths = tests

# 排除系统保留目录 / 版本控制 / 虚拟环境
# 注意：norecursedirs 的匹配是 fnmatch 风格，"System Volume Information"
# 带空格也能正确匹配（不需要转义）
norecursedirs =
    .git
    .hg
    .svn
    .tox
    .nox
    .eggs
    *.egg
    build
    dist
    node_modules
    venv
    .venv
    env
    .env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .idea
    .vscode
    System Volume Information
    $RECYCLE.BIN
    Recovery

# 让输出更易读
addopts =
    -ra
    --strict-markers
    --strict-config

# 自定义 marker 在此登记（避免 --strict-markers 误报）
markers =
    slow: 标记慢测试
    integration: 集成测试（依赖真实 cnlunar / 网络等）